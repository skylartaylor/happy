name: Release CLI Artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the CLI tarball
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter happy build

      - name: Pack immutable CLI artifact
        id: pack
        shell: bash
        run: |
          pnpm --filter happy pack --pack-destination "$RUNNER_TEMP"
          short_sha="${GITHUB_SHA:0:8}"
          source_file="$RUNNER_TEMP/happy-1.2.0.tgz"
          artifact_file="$RUNNER_TEMP/happy-cli-1.2.0-${short_sha}.tgz"
          mv "$source_file" "$artifact_file"
          echo "artifact=$artifact_file" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_FILE: ${{ steps.pack.outputs.artifact }}
        run: gh release upload "$RELEASE_TAG" "$ARTIFACT_FILE" --clobber
