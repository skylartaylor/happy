name: Android preview debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/happy-app/**'
      - 'packages/happy-wire/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Generate Android project
        run: pnpm --filter happy-app exec expo prebuild --platform android --no-install

      - name: Build arm64 debug APK
        working-directory: packages/happy-app/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          mkdir -p artifacts
          cp packages/happy-app/android/app/build/outputs/apk/debug/app-debug.apk artifacts/happy-preview-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/happy-preview-debug.apk
          sha256sum artifacts/happy-preview-debug.apk

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: happy-preview-debug-${{ github.sha }}
          path: artifacts/happy-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Add artifact link to summary
        run: echo "[Download APK](${{ steps.apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
